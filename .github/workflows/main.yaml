name: ProductionDeployment

on:
  push:
    branches:
      - main

env:
  COMMIT_ID: ${{ github.sha }}

jobs:
  deployToAKS:
    name: Deploy image to aks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source code
        uses: actions/checkout@v3
      - name: Azure Login
        uses: Azure/login@v1.4.6
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}
      - name: Setup kubectl
        id: install-kubectl
        uses: azure/setup-kubectl@v3
      - name: Install Helm
        run: |
          curl https://baltocdn.com/helm/signing.asc | sudo apt-key add -
          sudo apt-get install apt-transport-https --yes
          echo "deb https://baltocdn.com/helm/stable/debian/ all main" | sudo tee /etc/apt/sources.list.d/helm-stable-debian.list
          sudo apt-get update
          sudo apt-get install helm --yes
      - name: Deploy to AKS using Helm
        run: |
          az aks get-credentials --resource-group ${{ secrets.RESOURCE_GROUP }} --name ${{ secrets.CLUSTER_NAME }}
          helm template -s templates/deployment.yaml values-helm --set namespace.name=${{ vars.PROD_NAMESPACE}} --set image.name=${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKER_IMAGE_NAME }}:latest --set version.name=${COMMIT_ID:0:7} --set deployname.name=degree-java-${COMMIT_ID:0:7} | kubectl apply -f -